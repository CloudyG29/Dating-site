<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="chat-page">
    <div id="app">
      <div id="chat-header">
        <div class="avatar">SK</div>
        <div class="header-info">
          <div class="header-name">Sarah K.</div>
          <div class="header-status">
            <span class="status-dot"></span>Online now
          </div>
        </div>
        <i class="ti ti-dots-vertical"></i>
      </div>

      <div id="messages">
        <div class="date-divider">Today</div>
      </div>

      <div id="poll-status">Polling every 3s...</div>

      <div id="input-area">
        <input
          type="text"
          id="msg-input"
          placeholder="Type a message..."
          autocomplete="off"
        />
        <button id="send-btn" aria-label="Send message">
          <i class="ti ti-send"></i>
        </button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        getIdToken,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBV4ztQm7sxiEFyAFsvCWLclitY-6cq4T8",
        authDomain: "linkup-7880e.firebaseapp.com",
        projectId: "linkup-7880e",
        storageBucket: "linkup-7880e.firebasestorage.app",
        messagingSenderId: "1029218787471",
        appId: "1:1029218787471:web:12b1ecd53626beb7f6d0fa",
        measurementId: "G-VW5F5YZGND",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const messagesEl = document.getElementById("messages");
      const input = document.getElementById("msg-input");
      const pollStatus = document.getElementById("poll-status");

      const matchId = new URLSearchParams(window.location.search).get(
        "matchId",
      );
      const messageIds = new Set();
      let currentUid = null;
      let authToken = null;

      function formatTime() {
        return new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function getAuthHeaders() {
        return authToken ? { Authorization: `Bearer ${authToken}` } : {};
      }

      async function sendMessage() {
        const content = input.value.trim();
        if (!content || !matchId || !currentUid) return;
        input.value = "";

        renderMessage({
          id: `local-${Date.now()}`,
          senderUid: currentUid,
          content,
          sentAt: formatTime(),
        });

        try {
          await fetch("/api/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...getAuthHeaders(),
            },
            body: JSON.stringify({ matchId, content }),
          });
        } catch (err) {
          console.error("Message send failed:", err);
        }
      }

      async function poll() {
        if (!matchId || !currentUid) {
          pollStatus.textContent = "Waiting for chat authentication...";
          return;
        }

        try {
          const res = await fetch(`/api/messages/${matchId}`, {
            headers: getAuthHeaders(),
          });
          if (!res.ok) {
            const error = await res.json();
            pollStatus.textContent = error.error || "Unable to load messages";
            return;
          }
          const messages = await res.json();
          messages.forEach(renderMessage);
          pollStatus.textContent = `Last synced at ${formatTime()} · polling every 3s`;
        } catch (err) {
          console.error("Message poll failed:", err);
          pollStatus.textContent = "Unable to sync messages";
        }
      }

      document
        .getElementById("send-btn")
        .addEventListener("click", sendMessage);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }

        currentUid = user.uid;
        authToken = await getIdToken(user);
        await poll();
      });

      setInterval(poll, 3000);
    </script>
  </body>
</html>
